plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom{
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle (project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    modImplementation include ("com.github.Chocohead:Fabric-ASM:v2.3")

    //Needed Dependency
    modImplementation("vectorwing:FarmersDelight:${project.fdrf_version}") {
        exclude(group: "net.fabricmc")
    }
    modImplementation include("com.terraformersmc.terraform-api:terraform-wood-api-v1:7.0.3")

    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

    include "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    include "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

    modImplementation "net.firemuffin303:muffinsmcapi-fabric:${rootProject.muffins_api_version}"

    Collection<String> porting_lib_modules = rootProject.poritinglib_modules.split(',');
    for(x in porting_lib_modules){
        modImplementation(include("io.github.fabricators_of_create.Porting-Lib:${x}:${rootProject.portinglib_version}"))
    }


    modImplementation ("eu.midnightdust:midnightlib:${project.midnightlib_version}")

    //Non Needed Dependency
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    modRuntimeOnly("maven.modrinth:appleskin:${project.apple_skin_version}")

    modRuntimeOnly("maven.modrinth:cloth-config:2xQdCMyG")

    if (fot.toBoolean()){
        modRuntimeOnly("maven.modrinth:fish-of-thieves:hI4gvof3")
    }

    if(seasons.toBoolean()){
        modRuntimeOnly("maven.modrinth:serene-seasons:c1BdjabH")
        modRuntimeOnly("maven.modrinth:glitchcore:25HLOiOl")
    }

    if(expanded_delight.toBoolean()){
        modLocalRuntime("maven.modrinth:expanded-delight:4KEfJPHI")
    }
    modLocalRuntime("maven.modrinth:brewin-and-chewin-fabric:KPe7wpZQ")
    modCompileOnly("maven.modrinth:tough-as-nails:VaFrDMPi")
    modCompileOnly("maven.modrinth:glitchcore:25HLOiOl")

    modCompileOnly("maven.modrinth:fish-of-thieves:hI4gvof3")
    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${project.jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${project.jei_version}")

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:12.1.785"
    //modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:12.1.785"

    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    //modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", rootProject.fabric_loader_version
    inputs.property "mod_id", rootProject.mod_id
    inputs.property "farmersdelight_refabricated_version", rootProject.fdrf_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": rootProject.fabric_loader_version,
                "mod_id" : rootProject.mod_id,
                "farmersdelight_refabricated_version" : rootProject.fdrf_version
    }
}

shadowJar {
    exclude "architectury.common.json"
    exclude "META-INF"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

fabricApi {
    configureDataGeneration(){
        client = true
        modId = "muffins_thaidelight"
    }
}