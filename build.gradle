plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group


base {
    archivesName = project.archives_base_name
}


repositories {
    maven {
        // location of the maven that hosts JEI files before January 2023
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name "cardinal components, playerabilitylib, trinkets"
        url "https://maven.ladysnake.org/releases"
    }

    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }

    // Refabricated REPO -------------------
    maven {
        name = "Greenhouse Maven"
        url = 'https://maven.greenhouse.lgbt/releases/'
    }

    maven { url "https://mvn.devos.one/releases/" } // Porting Lib
    maven {
        url "https://maven.jamieswhiteshirt.com/libs-release" // Reach Entity Attributes (Required by Porting Lib)
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }
    maven {
        url "https://jitpack.io/" // Fabric ASM
        content {
            excludeGroup "io.github.fabricators_of_create"
        }
    }
    //--------------------------------------

    maven {
        url = "https://maven.midnightdust.eu/releases"
    }

    maven { url = "https://maven.shedaniel.me" }

    maven { url = "https://maven.bawnorton.com/releases" }

    maven { url = 'https://www.jitpack.io' }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation include ("com.github.Chocohead:Fabric-ASM:v2.3")

    //Needed Dependency
    modImplementation("vectorwing:FarmersDelight:${project.fdrf_version}") {
        exclude(group: "net.fabricmc")
    }
    modImplementation include("com.terraformersmc.terraform-api:terraform-wood-api-v1:7.0.3")

    modImplementation ("eu.midnightdust:midnightlib:${project.midnightlib_version}")

    //Non Needed Dependency
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    modRuntimeOnly("maven.modrinth:appleskin:${project.apple_skin_version}")

    modRuntimeOnly("maven.modrinth:cloth-config:2xQdCMyG")

    if (fot.toBoolean()){
        modRuntimeOnly("maven.modrinth:fish-of-thieves:hI4gvof3")
    }

    if(seasons.toBoolean()){
        modRuntimeOnly("maven.modrinth:serene-seasons:c1BdjabH")
        modRuntimeOnly("maven.modrinth:glitchcore:25HLOiOl")
    }

    if(expanded_delight.toBoolean()){
        modLocalRuntime("maven.modrinth:expanded-delight:4KEfJPHI")
    }
    modLocalRuntime("maven.modrinth:brewin-and-chewin-fabric:KPe7wpZQ")
    modCompileOnly("maven.modrinth:tough-as-nails:VaFrDMPi")
    modCompileOnly("maven.modrinth:glitchcore:25HLOiOl")

    modCompileOnly("maven.modrinth:fish-of-thieves:hI4gvof3")
    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${project.jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${project.jei_version}")

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:12.1.785"
    //modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:12.1.785"

    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    //modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

    modImplementation include('com.github.FireMuffin303:MuffinsEffectRenderAPI:0.1.0-alpha')
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

loom{
    runs {
        datagen {
            inherit server
            name "Fabric Data Generation"
            vmArg("-Dfabric-api.datagen")
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/generated/resources')}"
            vmArg("-Dfabric-api.datagen.modid=muffins_thaidelight")
            runDir "build/datagen"
        }
    }


    accessWidenerPath = file("src/main/resources/muffins_thaidelight.accesswidener")
}

sourceSets {
    main {
        resources {
            srcDirs += "src/generated/resources"

        }
    }
}