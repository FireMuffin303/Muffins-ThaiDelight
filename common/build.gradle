architectury {
    common (rootProject.enabled_platforms.split(',')){
        it.platformPackage "neoforge", "forge"
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modCompileOnly("net.firemuffin303:muffins_ovenapi-common:${rootProject.muffins_api_version}")
    modApi("me.shedaniel.cloth:cloth-config:$rootProject.cloth_config_version")
}

loom {
    accessWidenerPath = file("src/main/resources/muffinsthaidelight.accesswidener")

    sourceSets.main {
        resources {
            srcDirs += "src/generated/resources/"
        }
    }
}